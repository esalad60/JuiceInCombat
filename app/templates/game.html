{% extends "base.html" %}

{% block title %}Game — JuiceInCombat{% endblock %}

{% block head %}
    <style>
        html, body { background: #000; }
        #glCanvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 0;
        }
        .hud-root {
            position: fixed; inset: 0; z-index: 30;
            pointer-events: none;
            font-family: "Courier New", Consolas, ui-monospace, monospace;
        }
        .hud-root .pe { pointer-events: auto; }

        #command-bar {
            position: absolute; top: 16px; left: 16px; min-width: 240px;
        }
        #command-bar .row {
            display: flex; justify-content: space-between; gap: 18px;
            padding: 8px 12px;
        }

        #selected-unit-panel {
            position: absolute; bottom: 18px; left: 18px; width: 300px;
        }
        #weapon-info-panel {
            position: absolute; bottom: 18px; left: 334px; width: 220px;
        }
        #weapon-info-stats { padding: 10px 12px; font-size: 13px; line-height: 1.5; }
        #weapon-info-stats .stat { display:flex; justify-content:space-between; gap: 12px; }
        #unit-stats { padding: 10px 12px; font-size: 13px; line-height: 1.5; }
        #unit-stats .stat { display:flex; justify-content:space-between; }
        #unit-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 12px 12px; }

        #end-turn-btn { position: absolute; bottom: 18px; right: 18px; }

        #message-area {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
            min-width: 260px; text-align: center; padding: 8px 14px;
            font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
            display: none;
        }
        .hidden { display: none !important; }

        .recon-tag {
            display:inline-block; background: var(--jic-steel); color: var(--jic-ink);
            font-size: 9px; letter-spacing: .15em; padding: 2px 6px; border: 1px solid var(--jic-line);
            text-transform: uppercase; margin-left: 6px;
        }
    </style>
{% endblock %}

{% block content %}

{% set _flushed = get_flashed_messages() %}

<script>
    window.MATCH_ID = "{{ match_id }}";
</script>

<canvas id="glCanvas"></canvas>

<div class="hud-root">

    <div id="command-bar" class="jic-panel pe">
        <div class="jic-titlebar">Command</div>
        <div id="turn-indicator" class="jic-value" style="padding:8px 12px 0; color:var(--jic-cream); font-size:15px;">Waiting for game...</div>
        <div class="row">
            <div>
                <div class="jic-label">Cash</div>
                <div id="cash" class="jic-value" style="color:var(--jic-cream)">0</div>
            </div>
            <div style="text-align:right">
                <div class="jic-label">Turn Timer</div>
                <div id="turn-timer" class="jic-value">--</div>
            </div>
        </div>
    </div>

    <div id="selected-unit-panel" class="jic-panel pe hidden">
        <div class="jic-titlebar"><span id="panel-title">Selected</span></div>
        <div id="unit-stats"></div>
        <div id="unit-actions"></div>
    </div>

    <div id="weapon-info-panel" class="jic-panel pe hidden">
        <div class="jic-titlebar"><span id="weapon-info-title">Weapon</span></div>
        <div id="weapon-info-stats"></div>
    </div>

    <button id="end-turn-btn" class="jic-btn pe">End Turn</button>

    <div id="message-area" class="jic-panel pe"></div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module" src="/static/js/main.js"></script>
{% endblock %}
