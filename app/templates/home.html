<script>
  const socket = io();

  socket.on("connect", function () {
    console.log("Socket connected:", socket.id);
  });

  socket.on("room_created", function (data) {
    console.log("room_created received:", data);

    const redirectUrl = data.redirect_url || `/room/${data.room_code}`;

    console.log("Redirecting to:", redirectUrl);
    window.location.assign(redirectUrl);
  });

  socket.on("room_joined", function (data) {
    console.log("room_joined received:", data);

    const redirectUrl = data.redirect_url || `/room/${data.room_code}`;

    console.log("Redirecting to:", redirectUrl);
    window.location.assign(redirectUrl);
  });

  socket.on("room_error", function (data) {
    console.log("room_error received:", data);
    alert(data.message);
  });

  function createRoom() {
    console.log("Create room clicked");
    socket.emit("create_room");
  }

  function joinGameRoom() {
    console.log("Join room clicked");

    const code = document.getElementById("room_code").value.trim();

    if (!code) {
      alert("Enter a room code first.");
      return;
    }

    socket.emit("join_room", { room_code: code });
  }
</script>

<h1>home</h1>

<button type="button" onclick="createRoom()">Create Room</button>

<p>
  <button type="button" onclick="joinGameRoom()">Join Room</button>
  Room code: <input type="text" id="room_code">
</p>
