<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JuiceInCombat{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }
        canvas { display: block; }

    {% block head %}{% endblock %}
</head>
<body class="bg-gray-900 text-white">

</body>
</html>
