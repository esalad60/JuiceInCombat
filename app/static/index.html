<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tutorial</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #080b10;
        font-family: 'Courier New', monospace;
        color: #8ab4d4;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: default;
      }

      canvas.orbiting { cursor: grabbing; }

      #hud {
        position: fixed;
        bottom: 18px;
        left: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: none;
      }

      #controls {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 10px;
        opacity: 0.45;
        letter-spacing: 0.07em;
      }

      #controls span::before {
        content: '▸ ';
        opacity: 0.5;
      }

      #legend {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 10px;
        opacity: 0.55;
        letter-spacing: 0.06em;
        background: rgba(8, 11, 16, 0.55);
        padding: 8px 10px;
        border-radius: 4px;
        border: 1px solid rgba(255,255,255,0.06);
      }

      .swatch {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .swatch-box {
        width: 9px;
        height: 9px;
        border-radius: 2px;
        flex-shrink: 0;
      }
    </style>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"
      integrity="sha512-zhHQR0/H5SEBL3Wn6yYSaTTZej12z0hVZKOv3TwCUXT1z5qeqGcXJLLrbERYRScEDDpYIJhPC1fk31gqR783iQ=="
      crossorigin="anonymous"
      defer>
    </script>
    <script src="/frontend/static/webgl-demo.js" defer></script>
  </head>

  <body>
    <canvas id="glCanvas" width="1920" height="1080"></canvas>

    <div id="hud">
      <div id="legend">
        <div class="swatch"><div class="swatch-box" style="background:#3888d9"></div>Ocean</div>
        <div class="swatch"><div class="swatch-box" style="background:#9dd167"></div>Plains</div>
        <div class="swatch"><div class="swatch-box" style="background:#4dac37"></div>Grassland</div>
        <div class="swatch"><div class="swatch-box" style="background:#246b24"></div>Forest</div>
        <div class="swatch"><div class="swatch-box" style="background:#ad9460"></div>Hills</div>
        <div class="swatch"><div class="swatch-box" style="background:#ccc2bb"></div>Mountains</div>
        <div class="swatch"><div class="swatch-box" style="background:#c8b97e"></div>Desert</div>
        <div class="swatch"><div class="swatch-box" style="background:#dce8f0"></div>Tundra</div>
      </div>
      <div id="controls">
        <span>Right-click drag — orbit</span>
        <span>Scroll — zoom</span>
        <span>Middle-drag — pan</span>
      </div>
    </div>
  </body>
</html>
